<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">

<title>SocialBridge</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  min-height: 100vh;
  padding: 30px 18px;
}

.container {
  max-width: 450px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 35px;
}

.logo {
  width: 75px;
  height: 75px;
  margin: auto;
  border-radius: 24px;
  background: linear-gradient(135deg,#55e5d0,#209dbd);
  color: #10202b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: bold;
}

h1 {
  margin-top: 15px;
  font-size: 30px;
}

.subtitle {
  color: #aab8c9;
  margin-top: 8px;
}

.card {
  background: #1b293a;
  border: 1px solid #304156;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
}

.card h2 {
  margin-bottom: 10px;
}

.card p {
  color: #b6c3d2;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.buttons {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  text-align: center;
  text-decoration: none;
  padding: 14px 8px;
  border-radius: 10px;
  background: #55dfce;
  color: #10202b;
  font-weight: bold;
  font-size: 13px;
}

.btn.secondary {
  background: #e4edf5;
}

.note {
  text-align: center;
  color: #91a2b5;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 25px;
}

footer {
  text-align: center;
  color: #718399;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">S</div>
  <h1>SocialBridge</h1>
  <p class="subtitle">
    Your world of social connectivity.
  </p>
</header>

<div class="card">
  <h2>🔵 Facebook</h2>
  <p>
    Connect with Facebook through its official platform
